name: Publish Docs to GitHub Pages

on:
  push:
    branches:
      - master  # Triggers the build whenever you push to master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Zensical
        run: pip install zensical

      - name: Build Site
        run: zensical build --clean

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Its own job, so the artifact is listed by a fresh runner after the upload
  # has finished. Deploying in the same job as the upload can look for the
  # artifact before GitHub has made it visible, and fail with "No artifacts
  # named github-pages" (actions/deploy-pages#451).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # Publishes the built site to the Pages service
      id-token: write   # Lets the deploy step prove the artifact came from this run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        # Serves the uploaded artifact directly, so there is no gh-pages branch
        id: deployment
        uses: actions/deploy-pages@v5
