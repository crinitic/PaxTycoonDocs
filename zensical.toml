[project]
site_name = "PAXTycoon Docs"
site_url = "https://docs.paxtycoon.com/"
site_description = "PAXTycoon documentation"
site_author = "PAXTycoon CEO"

# Sidebar Navigation Structure
nav = [
  { "Home" = "index.md" },
  { "Personnel" = [
    { "Jobs" = [
      { "Flight Crew" = [
        { "Pilot" = "personnel/jobs/pilot.md" },
        { "Flight Attendant" = "personnel/jobs/flight-attendant.md" },
      ] },
      { "Ground" = [
        { "Gate Agent" = "personnel/jobs/gate-agent.md" },
        { "Mechanic" = "personnel/jobs/mechanic.md" },
        { "Lounge Staff" = "personnel/jobs/lounge-staff.md" },
      ] },
      { "Specialists" = [
        { "Aircraft Advisor" = "personnel/jobs/aircraft-advisor.md" },
        { "Financial Advisor" = "personnel/jobs/financial-advisor.md" },
        { "Personnel Advisor" = "personnel/jobs/personnel-advisor.md" },
        { "Route Advisor" = "personnel/jobs/route-advisor.md" },
        { "Informer" = "personnel/jobs/informer.md" },
        { "Lawyer" = "personnel/jobs/lawyer.md" },
        { "Security Manager" = "personnel/jobs/security-manager.md" },
        { "Trainer" = "personnel/jobs/trainer.md" },
      ] },
    ]},
    { "Competence" = "personnel/competence.md" },
    { "Satisfaction" = "personnel/satisfaction.md" },
    { "Training" = "personnel/training.md" },
    { "Absence and Incidents" = "personnel/absence-incidents.md" },
  ] },
  { "FAQ" = "faq.md" },
]

extra_css = ["assets/stylesheets/paxtycoon.css"]

[project.theme]
variant = "modern"
logo = "assets/logo.png"
favicon = "assets/favicon.png"

features = [
  "navigation.tabs",      # Top-level tabs for clean navigation
  "navigation.sections",  # Groups sidebar links into sections
  "search.highlight",     # Highlights searched words on the page
]

[[project.theme.palette]]
scheme = "paxtycoon"

[project.theme.font]
text = "Inter"
code = "Roboto Mono"

[project.extra]
generator = false
