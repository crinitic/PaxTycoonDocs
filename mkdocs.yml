site_name: PAXTycoon Docs
site_url: https://docs.paxtycoon.com/
site_description: PAXTycoon documentation
site_author: PAXTycoon CEO

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  # One scheme only: the game is dark and has no light mode, so neither does
  # this. The hues themselves live in assets/stylesheets/paxtycoon.css.
  palette:
    scheme: paxtycoon

  font:
    text: Inter
    code: Roboto Mono

  features:
    - navigation.tabs      # Top-level tabs for clean navigation
    - navigation.sections  # Groups sidebar links into sections
    - search.suggest       # Auto-suggest search terms
    - search.highlight     # Highlights searched words on the page

# Sidebar Navigation Structure
nav:
  - Home: index.md
  - Personnel:
    - Flight Crew:
      - Pilot: personnel/pilot.md
      - Flight Attendant: personnel/flight-attendant.md
    - Ground:
      - Gate Agent: personnel/gate-agent.md
      - Mechanic: personnel/mechanic.md
      - Lounge Staff: personnel/lounge-staff.md
    - Specialists:
      - Aircraft Advisor: personnel/aircraft-advisor.md
      - Financial Advisor: personnel/financial-advisor.md
      - Personnel Advisor: personnel/personnel-advisor.md
      - Route Advisor: personnel/route-advisor.md
      - Informer: personnel/informer.md
      - Lawyer: personnel/lawyer.md
      - Security Manager: personnel/security-manager.md
      - Trainer: personnel/trainer.md
  - FAQ: faq.md

extra_css:
  - assets/stylesheets/paxtycoon.css