site_name: PAXTycoon Docs
site_url: https://docs.paxtycoon.com/
site_description: PAXTycoon documentation
site_author: PAXTycoon CEO

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  # One scheme only: the game is dark and has no light mode, so neither does
  # this. The hues themselves live in assets/stylesheets/paxtycoon.css.
  palette:
    scheme: paxtycoon

  font:
    text: Inter
    code: Roboto Mono

  features:
    - navigation.tabs      # Top-level tabs for clean navigation
    - navigation.sections  # Groups sidebar links into sections
    - search.suggest       # Auto-suggest search terms
    - search.highlight     # Highlights searched words on the page

# Sidebar Navigation Structure
nav:
  - Home: index.md
  - Play: 
    - Overview: play/overview.md
    - Personnel: play/personnel.md
    - Fleet: play/fleet.md
  - FAQ: faq.md

extra_css:
  - assets/stylesheets/paxtycoon.css
